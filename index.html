<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="app-build" content="20260802-2015">
<meta name="theme-color" content="#14161C">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="கடை போஸ்டர்">
<title>கடை போஸ்டர் — Kadai Poster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Tamil:wght@400;500;600;700;800&family=Catamaran:wght@400;500;600;700;800;900&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14161C; --ink2:#1C1F27; --ink3:#262A34;
  --line:#333846; --line2:#454B5C;
  --paper:#F6F1E7; --txt:#EDEAE3; --txt2:#9AA0AE;
  --gold:#FF9500; --gold2:#FFB340; --teal:#12A594; --red:#E5484D; --green:#30A46C;
  --r:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:var(--ink); color:var(--txt);
  font-family:'Anek Tamil','Catamaran',system-ui,sans-serif;
  font-size:17px; line-height:1.45;
  overscroll-behavior-y:none; -webkit-font-smoothing:antialiased;
}
input,textarea,select,button{font-family:inherit;font-size:inherit;color:inherit;}
button{background:none;border:none;cursor:pointer;}
.num{font-family:'Poppins',sans-serif;}

/* ============ App shell ============ */
#app{min-height:100%;display:flex;flex-direction:column;}
.topbar{
  position:sticky;top:0;z-index:40;background:rgba(20,22,28,.94);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:12px 16px;
  padding-top:calc(12px + env(safe-area-inset-top));
}
.topbar .tb-title{font-weight:700;font-size:21px;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar .tb-sub{font-size:13px;color:var(--txt2);font-weight:500;}
.iconbtn{width:40px;height:40px;border-radius:11px;background:var(--ink3);
  display:flex;align-items:center;justify-content:center;font-size:19px;flex:0 0 40px;}
.iconbtn:active{background:var(--line);}

main{flex:1;padding:16px 16px 108px;}
.screen{display:none;} .screen.on{display:block;}

/* ============ Bottom nav ============ */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:45;
  background:rgba(20,22,28,.96);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom);
}
.nav button{flex:1;padding:10px 4px 12px;display:flex;flex-direction:column;
  align-items:center;gap:3px;color:var(--txt2);font-size:13px;font-weight:600;}
.nav button .ni{font-size:21px;line-height:1;}
.nav button small{font-family:'Poppins',sans-serif;font-size:10px;font-weight:600;
  opacity:.7;line-height:1;margin-top:-1px;}
.nav button.on{color:var(--gold);}

/* ============ Cards / lists ============ */
.card{background:var(--ink2);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;}
.card h3{font-size:18px;font-weight:700;margin-bottom:10px;}
.muted{color:var(--txt2);font-size:15px;}
.sechead{font-size:14px;font-weight:700;color:var(--txt2);letter-spacing:1.2px;
  text-transform:uppercase;margin:22px 4px 10px;}
.sechead:first-child{margin-top:4px;}

/* ============ Buttons ============ */
.btn{display:flex;align-items:center;justify-content:center;gap:9px;
  width:100%;padding:15px 18px;border-radius:13px;font-weight:700;font-size:18px;
  background:var(--ink3);border:1px solid var(--line2);}
.btn:active{transform:scale(.985);}
.btn.pri{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#231200;border:none;}
.btn.teal{background:var(--teal);color:#04231F;border:none;}
.btn.ghost{background:transparent;}
.btn.danger{background:transparent;border-color:#5A2326;color:#FF8A8E;}
.btn.sm{padding:11px 14px;font-size:16px;border-radius:11px;}
.btnrow{display:flex;gap:10px;} .btnrow .btn{flex:1;}
.shrow{display:flex;gap:10px;margin-bottom:10px;}
.shbtn{min-width:0;}
.shbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:13px 6px 12px;border-radius:13px;font-weight:700;font-size:15px;color:#fff;
  border:none;line-height:1.15;}
.shbtn:active{transform:scale(.97);}
.shbtn .si{font-size:23px;line-height:1;}
.shbtn small{font-family:'Poppins',sans-serif;font-size:11px;font-weight:600;opacity:.85;}

/* ============ Form fields ============ */
.fld{margin-bottom:14px;}
.fld label{display:block;font-size:15px;font-weight:600;color:var(--txt2);margin-bottom:6px;}
.fld label b{font-family:'Poppins',sans-serif;font-size:13px;font-weight:600;opacity:.72;}
.fld input,.fld textarea,.fld select{
  width:100%;background:var(--ink3);border:1px solid var(--line2);border-radius:11px;
  padding:13px 14px;font-size:17px;font-weight:500;color:var(--txt);}
.fld textarea{resize:vertical;min-height:76px;}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--gold);}
.fld .hint{font-size:13px;color:var(--txt2);margin-top:5px;}
.fld2{display:flex;gap:10px;} .fld2>*{flex:1;min-width:0;}

/* ============ Template gallery ============ */
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.tcard{background:var(--ink2);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;text-align:left;}
.tcard:active{border-color:var(--gold);}
.tcard .tprev{width:100%;aspect-ratio:1;background:var(--ink3);display:block;}
.tcard .tname{padding:10px 12px 12px;font-weight:700;font-size:16px;line-height:1.25;}
.tcard .tname small{display:block;color:var(--txt2);font-weight:500;font-size:13px;margin-top:2px;}

/* ============ Editor stage ============ */
.stage{
  background:linear-gradient(180deg,#0C0D11,#191C24);
  border:1px solid var(--line);border-radius:var(--r);
  padding:16px;display:flex;justify-content:center;margin-bottom:12px;
}
.stage canvas{max-width:100%;height:auto;border-radius:6px;
  box-shadow:0 14px 34px rgba(0,0,0,.6);display:block;}
.sizechips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px;
  scrollbar-width:none;}
.sizechips::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto;padding:9px 15px;border-radius:999px;background:var(--ink3);
  border:1px solid var(--line2);font-size:15px;font-weight:600;color:var(--txt2);}
.chip.on{background:var(--gold);color:#231200;border-color:var(--gold);}
.goldrule{height:2px;border-radius:2px;margin:0 0 16px;
  background:linear-gradient(90deg,var(--gold),rgba(255,149,0,0));}

/* feature row editor */
.frow{display:flex;gap:8px;align-items:center;margin-bottom:9px;}
.frow .ficon{flex:0 0 54px;height:48px;border-radius:11px;background:var(--ink3);
  border:1px solid var(--line2);font-size:22px;display:flex;align-items:center;justify-content:center;}
.frow input{flex:1;background:var(--ink3);border:1px solid var(--line2);border-radius:11px;
  padding:12px 13px;font-size:16px;min-width:0;}
.frow .fdel{flex:0 0 40px;height:48px;border-radius:11px;background:transparent;
  border:1px solid #4A2A2C;color:#FF8A8E;font-size:17px;}

/* colour swatches */
.swatches{display:flex;gap:9px;flex-wrap:wrap;}
.sw{width:44px;height:44px;border-radius:12px;border:2px solid transparent;}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--ink);}
.sw.custom{position:relative;overflow:hidden;padding:0;
  background:conic-gradient(#F00,#FF0,#0F0,#0FF,#00F,#F0F,#F00);}
.sw.custom input{position:absolute;left:-25%;top:-25%;width:150%;height:150%;
  opacity:0;border:none;padding:0;cursor:pointer;}
.sw.custom span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);pointer-events:none;}
.swrow{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap;}
.swrow .code{font-family:'Poppins',sans-serif;font-size:15px;color:var(--txt2);}

/* art picker */
.artgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
.artbtn{aspect-ratio:1;border-radius:12px;background:var(--ink3);border:1px solid var(--line2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:22px;padding:4px;}
.artbtn small{font-size:11px;color:var(--txt2);font-weight:600;line-height:1.05;}
.artbtn i{font-style:normal;font-family:'Poppins',sans-serif;font-size:9px;
  color:var(--txt2);opacity:.65;line-height:1;margin-top:1px;}
.artbtn.on{border-color:var(--gold);background:#2A2216;}

/* saved posters */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.pitem{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);}
.pitem img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--ink3);}
.pitem .pbar{display:flex;background:var(--ink2);}
.pitem .pbar button{flex:1;padding:10px 0;font-size:15px;font-weight:600;color:var(--txt2);}
.pitem .pbar button+button{border-left:1px solid var(--line);}

/* empty state */
.empty{text-align:center;padding:44px 20px;}
.empty .ei{font-size:46px;margin-bottom:10px;}
.empty h4{font-size:19px;font-weight:700;margin-bottom:6px;}
.empty p{color:var(--txt2);font-size:16px;margin-bottom:18px;}

/* logo preview */
.logobox{display:flex;align-items:center;gap:14px;}
.logoprev{width:72px;height:72px;border-radius:18px;background:var(--ink3);
  border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;
  overflow:hidden;flex:0 0 72px;}
.logoprev img{width:100%;height:100%;object-fit:cover;}
.logoprev span{font-size:30px;font-weight:800;color:var(--txt2);}

/* ============ Modal ============ */
.mask{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.62);
  display:none;align-items:flex-end;backdrop-filter:blur(3px);}
.mask.on{display:flex;}
.sheet{background:var(--ink2);width:100%;max-height:88vh;overflow-y:auto;
  border-radius:20px 20px 0 0;border-top:1px solid var(--line);
  padding:18px 16px calc(24px + env(safe-area-inset-bottom));}
.sheet.full{max-height:100vh;height:100vh;border-radius:0;}
.sheethead{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.sheethead h3{flex:1;font-size:20px;font-weight:700;}

/* ============ PIN ============ */
#pinScreen{position:fixed;inset:0;z-index:90;background:var(--ink);
  display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
#pinScreen.on{display:flex;}
#pinScreen .plogo{font-size:52px;margin-bottom:6px;}
#pinScreen h2{font-size:26px;font-weight:800;margin-bottom:4px;}
#pinScreen .psub{color:var(--txt2);font-size:16px;margin-bottom:26px;text-align:center;}
.pdots{display:flex;gap:16px;margin-bottom:14px;}
.pdot{width:16px;height:16px;border-radius:50%;background:var(--ink3);border:1px solid var(--line2);}
.pdot.on{background:var(--gold);border-color:var(--gold);}
.pmsg{min-height:24px;font-size:15px;font-weight:600;color:var(--txt2);margin-bottom:14px;}
.pmsg.err{color:#FF8A8E;}
.pkeys{display:grid;grid-template-columns:repeat(3,84px);gap:14px;}
.pkey{height:70px;border-radius:18px;background:var(--ink2);border:1px solid var(--line);
  font-size:27px;font-weight:600;font-family:'Poppins',sans-serif;
  display:flex;align-items:center;justify-content:center;touch-action:manipulation;}
.pkey:active{background:var(--ink3);}
.pkey.blank{background:none;border:none;}

/* ============ Toast ============ */
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);
  background:#F6F1E7;color:#14161C;padding:13px 20px;border-radius:12px;font-weight:700;
  font-size:16px;z-index:100;opacity:0;pointer-events:none;transition:.24s;
  max-width:88vw;text-align:center;box-shadow:0 8px 26px rgba(0,0,0,.5);}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

/* ============ Loader ============ */
#boot{position:fixed;inset:0;z-index:120;background:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
#boot .bl{font-size:46px;}
#boot .bt{font-size:20px;font-weight:700;}
.spin{width:26px;height:26px;border:3px solid var(--line2);border-top-color:var(--gold);
  border-radius:50%;animation:sp .8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}}

/* ============ Flash ticker ============ */
#flash{background:linear-gradient(90deg,var(--gold),var(--gold2));color:#231200;
  font-weight:700;font-size:15px;padding:8px 0;overflow:hidden;display:none;}
#flash.on{display:block;}
#flash span{display:inline-block;white-space:nowrap;padding-left:100%;
  animation:tick 18s linear infinite;}
@keyframes tick{to{transform:translateX(-100%)}}
</style>
</head>
<body>

<div id="boot"><div class="bl">🎨</div><div class="bt">கடை போஸ்டர்</div><div class="spin"></div></div>

<!-- ===== PIN ===== -->
<div id="pinScreen">
  <div class="plogo">🔒</div>
  <h2>கடை போஸ்டர்</h2>
  <div class="psub" id="pinSub">உங்கள் PIN-ஐ உள்ளிடுங்கள்<br>Enter your PIN</div>
  <div class="pdots" id="pinDots"></div>
  <div class="pmsg" id="pinMsg"></div>
  <div class="pkeys" id="pinKeys"></div>
</div>

<!-- ===== App ===== -->
<div id="app" style="display:none">
  <div class="topbar">
    <div style="flex:1;min-width:0">
      <div class="tb-title" id="tbTitle">கடை போஸ்டர்</div>

    <button class="iconbtn" id="btnHelp">?</button>

    <div class="screen" id="scShop">

        </div>

        <div class="fld"><label>கடை பெயர் <b>Shop name</b></label>

          <div class="fld"><label>போன் <b>Phone</b></label><input id="pfPhone" class="num" inputmode="tel" placeholder="+91 99948 69502"></div>

        <div class="fld"><label>WhatsApp <b>optional</b></label>
          <input id="pfWa" class="num" inputmode="tel" placeholder="+91 99948 69502"></div>
        <div class="fld"><label>முகவரி <b>Address</b></label>
          <textarea id="pfAddr" placeholder="கடை முகவரி"></textarea></div>

        <div class="fld"><label>பிராண்ட் நிறம் <b>Brand colour</b></label>
          <div class="swatches" id="colorSw"></div>
          <div class="hint">இந்த நிறம் எல்லா போஸ்டரிலும் தானாக வரும்</div></div>

        <button class="btn pri" id="btnSaveProfile">சேமி · Save</button>
      </div>

      <div class="sechead">அமைப்பு · Settings</div>
      <div class="card">
        <div class="fld"><label>PIN மாற்று <b>Change PIN — 4 digits</b></label>
          <input id="setPin" class="num" inputmode="numeric" maxlength="4" placeholder="••••"></div>
        <button class="btn sm" id="btnSetPin">PIN சேமி · Save PIN</button>
        <div style="height:12px"></div>
        <div class="muted" id="shopMeta"></div>
      </div>
    </div>
  </main>

  <div class="nav">
    <button data-sc="scNew" class="on"><span class="ni">✨</span>புதிது<small>New</small></button>
    <button data-sc="scMine"><span class="ni">🖼️</span>எனது<small>Saved</small></button>
    <button data-sc="scShop"><span class="ni">🏪</span>கடை<small>Shop</small></button>
  </div>
</div>

<!-- ===== Editor sheet ===== -->
<div class="mask" id="edMask">
  <div class="sheet full" id="edSheet">
    <div class="sheethead">
      <button class="iconbtn" id="edClose">✕</button>
      <h3 id="edTitle">போஸ்டர் · Poster</h3>
      <button class="iconbtn" id="edSave">💾</button>
    </div>
    <div class="stage"><canvas id="cv"></canvas></div>
    <div class="sizechips" id="sizeChips"></div>
    <div class="goldrule"></div>
    <div class="shrow" id="shareRow"></div>
    <div class="btnrow" style="margin-bottom:18px">
      <button class="btn pri" id="btnDl">⬇ டவுன்லோட் / Download</button>
      <button class="btn ghost" id="btnShare">➦ மற்றவை / Other</button>
    </div>
    <div id="edFields"></div>
    <div style="height:30px"></div>
  </div>
</div>

<!-- ===== Generic sheet ===== -->
<div class="mask" id="gMask">
  <div class="sheet">
    <div class="sheethead"><h3 id="gTitle"></h3><button class="iconbtn" id="gClose">✕</button></div>
    <div id="gBody"></div>
  </div>
</div>

<div id="toast"></div>
<canvas id="cvExport" hidden></canvas>
<input type="file" id="artFile" accept="image/*" hidden>

/* ==========================================================================
   Storage layer — Firebase with a localStorage mirror so the app keeps
   working when the connection drops.
   ========================================================================== */
const LS_KEY = 'kp_' + SHOP_ID;

function lsRead() {
  try { return JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch (e) { return {}; }
}
function lsWrite(obj) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(obj)); } catch (e) {}
}
function lsPatch(path, val) {
  const o = lsRead();
  const parts = path.split('/');
  let cur = o;
  for (let i = 0; i < parts.length - 1; i++) {
    if (typeof cur[parts[i]] !== 'object' || cur[parts[i]] === null) cur[parts[i]] = {};
    cur = cur[parts[i]];
  }
  if (val === null) delete cur[parts[parts.length - 1]];
  else cur[parts[parts.length - 1]] = val;
  lsWrite(o);
}

async function dbSet(path, val) {
  lsPatch(path, val);
  if (!fbOK) return;
  try { await db.ref(ROOT + '/' + path).set(val); }
  catch (e) { logErr('dbSet ' + path, e); throw e; }
}
async function dbPush(path, val) {
  const key = 'k' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  lsPatch(path + '/' + key, val);
  if (fbOK) { try { await db.ref(ROOT + '/' + path + '/' + key).set(val); } catch (e) { logErr('dbPush', e); } }
  return key;
}
async function dbGet(path) {
  if (fbOK) {
    try {
      const snap = await db.ref(ROOT + '/' + path).get();
      if (snap.exists()) return snap.val();
    } catch (e) { logErr('dbGet ' + path, e); }

  return path.split('/').reduce((a, k) => (a && a[k] !== undefined ? a[k] : null), o);
}

let pinBuf = '';

function renderPinDots() {
  $('pinDots').innerHTML = [0,1,2,3].map(i =>
    '<div class="pdot' + (i < pinBuf.length ? ' on' : '') + '"></div>').join('');
}
function pinMsg(txt, isErr) {
  const m = $('pinMsg'); m.textContent = txt || '';
  m.classList.toggle('err', !!isErr);
}

function buildPinKeys() {
  const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
  $('pinKeys').innerHTML = keys.map(k =>
    k === '' ? '<div class="pkey blank"></div>'
             : '<button class="pkey" data-k="' + k + '">' + k + '</button>').join('');

  /* Touch fires touchend then a synthetic click. Handle touchend for instant
     response and suppress only that paired click — never a later real tap. */
  let lastTouch = 0;
  $('pinKeys').querySelectorAll('.pkey[data-k]').forEach(btn => {
    btn.addEventListener('touchend', ev => {
      ev.preventDefault();
      lastTouch = Date.now();
      pinTap(btn.dataset.k);
    }, { passive: false });
    btn.addEventListener('click', () => {
      if (Date.now() - lastTouch < 700) return;   /* paired synthetic click */
      pinTap(btn.dataset.k);
    });
  });
}

async function pinTap(k) {
  if (k === '⌫') { pinBuf = pinBuf.slice(0, -1); renderPinDots(); pinMsg(''); return; }
  if (pinBuf.length >= 4) return;
  pinBuf += k; renderPinDots();
  if (pinBuf.length < 4) return;

  /* race guard: hash may still be loading from Firebase on a slow connection */
  if (!S.pinLoaded) {
    pinMsg('ஏற்றுகிறது, சற்று பொறுங்கள்…');
    const t0 = Date.now();
    while (!S.pinLoaded && Date.now() - t0 < 6000) await new Promise(r => setTimeout(r, 120));
    if (!S.pinLoaded) { pinMsg('இணைப்பு இல்லை. மீண்டும் முயலுங்கள்', true); pinBuf = ''; renderPinDots(); return; }
    pinMsg('');
  }

  const h = await sha256(pinBuf);
  if (h === S.pinHash || h === MASTER_PIN_HASH) {
    sessionStorage.setItem('kp_unlocked', '1');
    $('pinScreen').classList.remove('on');
    $('app').style.display = 'flex';
    pinBuf = ''; renderPinDots(); pinMsg('');
    setTimeout(autoCheckPopup, 2500);
  } else {
    pinMsg('தவறான PIN', true);
    pinBuf = ''; renderPinDots();
    if (navigator.vibrate) navigator.vibrate(60);
  }
}

/* resize an uploaded image down before storing it */
function readImageResized(file, maxSide) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('read failed'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('decode failed'));
      img.onload = () => {
        const sc = Math.min(1, maxSide / Math.max(img.width, img.height));
        const w = Math.round(img.width * sc), h = Math.round(img.height * sc);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', 0.86));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---------- colour ---------- */
function hexToRgb(h) {
  h = h.replace('#',''); if (h.length === 3) h = h.split('').map(c => c + c).join('');
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function rgbToHsl(r,g,b) {
  r/=255; g/=255; b/=255;
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b); let h=0, s=0; const l = (mx+mn)/2;
  if (mx !== mn) {
    const d = mx - mn;
    s = l > .5 ? d/(2-mx-mn) : d/(mx+mn);
    h = mx === r ? ((g-b)/d + (g<b?6:0)) : mx === g ? ((b-r)/d + 2) : ((r-g)/d + 4);
    h /= 6;
  }
  return [h,s,l];
}
function hslHex(h,s,l) {
  const f = n => {
    const k = (n + h*12) % 12, a = s*Math.min(l,1-l);
    const c = l - a*Math.max(-1, Math.min(k-3, Math.min(9-k,1)));
    return Math.round(255*c).toString(16).padStart(2,'0');
  };
  return '#' + f(0) + f(8) + f(4);
}
function pal(base) {
  let hsl; try { hsl = rgbToHsl(...hexToRgb(base)); } catch (e) { hsl = rgbToHsl(15,66,149); }
  const [h,s0,l0] = hsl;
  const s = Math.max(.38, Math.min(s0, .92));
  return {
    deep: hslHex(h, Math.min(s+.08,1), Math.max(l0-.24,.05)),
    d1:   hslHex(h, Math.min(s+.04,1), Math.max(l0-.14,.09)),
    mid:  base,
    lt:   hslHex(h, s, Math.min(l0+.13,.58)),
    hi:   hslHex(h, Math.min(s+.10,1), Math.min(l0+.30,.72)),
    gold:'#FDE047', gold2:'#F0A70C', goldD:'#8A4B02',
    cream:'#FFF6DC', paper:'#FFFFFF'
  };
}

/* ---------- canvas primitives ---------- */
function rr(ctx,x,y,w,h,r) {
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function lg(ctx,x0,y0,x1,y1,stops) {
  const g = ctx.createLinearGradient(x0,y0,x1,y1);
  stops.forEach(([o,c]) => g.addColorStop(o,c));
  return g;
}
function font(w,size,fam) { return w + ' ' + size + 'px ' + (fam || FONT_T); }

/* shrink until it fits one line */
function fitSize(ctx, text, maxW, start, min, weight, fam) {
  let s = start;
  while (s > min) {
    ctx.font = font(weight, s, fam);
    if (ctx.measureText(text).width <= maxW) break;
    s -= 2;
  }
  return s;
}
/* wrap into <=maxLines, shrinking if needed */
function wrapFit(ctx, text, maxW, start, min, weight, maxLines, fam) {
  const words = String(text || '').trim().split(/\s+/).filter(Boolean);
  if (!words.length) return { lines: [], size: start };
  let s = start;
  for (; s > min; s -= 2) {
    ctx.font = font(weight, s, fam);
    const lines = []; let cur = '';
    let bad = false;
    for (const w of words) {
      const t = cur ? cur + ' ' + w : w;
      if (ctx.measureText(t).width <= maxW) { cur = t; }
      else {
        if (cur) lines.push(cur);
        cur = w;
        if (ctx.measureText(w).width > maxW) { bad = true; break; }
      }
    }
    if (bad) continue;
    if (cur) lines.push(cur);
    if (lines.length <= maxLines) return { lines, size: s };
  }
  ctx.font = font(weight, min, fam);
  return { lines: [String(text)], size: min };
}

/* big gradient headline with a dark relief edge */
function headline(ctx, text, cx, top, maxW, maxSize, P, maxLines) {
  const r = wrapFit(ctx, text, maxW, maxSize, 34, '800', maxLines || 2, FONT_T);
  if (!r.lines.length) return top;
  const lh = r.size * 1.03;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  r.lines.forEach((ln, i) => {
    const y = top + i * lh;
    ctx.font = font('800', r.size, FONT_T);
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 22; ctx.shadowOffsetY = 10;
    ctx.fillStyle = P.goldD;
    ctx.fillText(ln, cx, y + Math.max(4, r.size * 0.045));
    ctx.restore();
    const g = lg(ctx, 0, y, 0, y + r.size, [[0,'#FFF9E3'],[.42,P.gold],[.88,P.gold2],[1,'#FFEFC0']]);
    ctx.fillStyle = g;
    ctx.fillText(ln, cx, y);
  });
  return top + r.lines.length * lh;
}

/* plain wrapped text */
function para(ctx, text, cx, top, maxW, size, color, weight, maxLines, align) {
  const r = wrapFit(ctx, text, maxW, size, 16, weight || '600', maxLines || 2, FONT_T);
  ctx.textAlign = align || 'center'; ctx.textBaseline = 'top';
  ctx.fillStyle = color;
  const lh = r.size * 1.24;
  r.lines.forEach((ln, i) => { ctx.font = font(weight||'600', r.size, FONT_T); ctx.fillText(ln, cx, top + i*lh); });
  return top + r.lines.length * lh;
}

/* footer bar: area + phone */
function footerBar(ctx, P, d, y, h) {
  const area = (d.area || '').trim(), phone = (d.phone || '').trim();
  if (!area && !phone) return;
  ctx.fillStyle = lg(ctx, 0, y, 0, y+h, [[0,P.gold],[1,P.gold2]]);
  ctx.fillRect(0, y, SQ, h);
  ctx.fillStyle = 'rgba(0,0,0,.16)'; ctx.fillRect(0, y, SQ, 3);

  const cy = y + h/2;
  ctx.textBaseline = 'middle';
  const aSize = area  ? fitSize(ctx, area,  380, 40, 22, '700', FONT_T) : 0;
  const pSize = phone ? fitSize(ctx, phone, 430, 38, 22, '700', FONT_N) : 0;
  ctx.font = font('700', aSize, FONT_T); const aw = area ? ctx.measureText(area).width : 0;
  ctx.font = font('700', pSize, FONT_N); const pw = phone ? ctx.measureText(phone).width : 0;

  const icon = 46, gap = 14, sep = (area && phone) ? 46 : 0;
  const total = (area ? icon+gap+aw : 0) + sep + (phone ? icon+gap+pw : 0);
  let x = (SQ - total) / 2;

  const dot = (px) => {
    ctx.beginPath(); ctx.arc(px + icon/2, cy, icon/2, 0, 7); ctx.fillStyle = P.deep; ctx.fill();
  };
  if (area) {
    dot(x);
    ctx.fillStyle = P.gold; ctx.font = font('700', 22, FONT_T);
    ctx.textAlign = 'center'; ctx.fillText('◉', x + icon/2, cy + 1);
    ctx.textAlign = 'left'; ctx.fillStyle = P.deep;
    ctx.font = font('700', aSize, FONT_T); ctx.fillText(area, x + icon + gap, cy);
    x += icon + gap + aw + sep;
  }
  if (phone) {
    dot(x);
    ctx.fillStyle = P.gold; ctx.font = font('700', 21, FONT_T);
    ctx.textAlign = 'center'; ctx.fillText('✆', x + icon/2, cy + 1);
    ctx.textAlign = 'left'; ctx.fillStyle = P.deep;
    ctx.font = font('700', pSize, FONT_N); ctx.fillText(phone, x + icon + gap, cy);
  }
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}

function brandRow(ctx, P, d, y, align) {

  const box = 76;
  const nSize = name ? fitSize(ctx, name, 700, 40, 22, '700', FONT_T) : 0;
  ctx.font = font('700', nSize, FONT_T);
  const nw = name ? ctx.measureText(name).width : 0;
  const total = box + 18 + nw;
  let x = align === 'left' ? 56 : (SQ - total) / 2;

  /* logo tile */
  ctx.save();
  rr(ctx, x, y, box, box, 20);
  ctx.fillStyle = lg(ctx, x, y, x+box, y+box, [[0,P.gold],[1,P.gold2]]);
  ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 5;
  ctx.fill(); ctx.restore();
  if (hasLogo) {
    ctx.save(); rr(ctx, x, y, box, box, 20); ctx.clip();
    ctx.drawImage(ART.logo, x, y, box, box); ctx.restore();
  } else {
    ctx.fillStyle = P.deep; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = font('800', 42, FONT_T);
    ctx.fillText((name || 'க').trim().charAt(0), x + box/2, y + box/2 + 2);
  }

  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = P.cream; ctx.font = font('700', nSize, FONT_T);
  ctx.fillText(name, x + box + 18, y + (tag ? 4 : box/2 - nSize*0.62));
  if (tag) {
    const tSize = fitSize(ctx, tag, 640, 22, 14, '600', FONT_T);
    ctx.fillStyle = P.hi; ctx.font = font('600', tSize, FONT_T);
    ctx.fillText(tag, x + box + 18, y + 6 + nSize * 1.12);
  }
  ctx.textBaseline = 'alphabetic';
  return y + box;
}

/* circular corner badge */
function badge(ctx, P, l1, l2, l3, cx, cy, r) {
  if (!l1 && !l2 && !l3) return;
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(-9 * Math.PI/180);
  ctx.beginPath(); ctx.arc(0,0,r,0,7);
  ctx.fillStyle = lg(ctx,-r,-r,r,r,[[0,'#FDE047'],[.7,P.gold2],[1,'#C77C05']]);
  ctx.shadowColor='rgba(0,0,0,.45)'; ctx.shadowBlur=22; ctx.shadowOffsetY=8; ctx.fill();
  ctx.restore();
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(-9*Math.PI/180);
  ctx.beginPath(); ctx.arc(0,0,r-5,0,7);
  ctx.strokeStyle='rgba(255,255,255,.45)'; ctx.lineWidth=5; ctx.stroke();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const w = r*1.55;
  let y = -(l1?1:0)*24 - (l3?10:0);
  if (l1) { const s=fitSize(ctx,l1,w,30,14,'700',FONT_T); ctx.font=font('700',s,FONT_T);
            ctx.fillStyle=P.deep; ctx.fillText(l1,0,y); y += s*0.95; }
  if (l2) { const s=fitSize(ctx,l2,w,52,20,'700',FONT_N); ctx.font=font('700',s,FONT_N);
            ctx.fillStyle='#7A1C05'; ctx.fillText(l2,0,y + s*0.42); y += s*0.92; }
  if (l3) { const s=fitSize(ctx,l3,w,28,13,'700',FONT_T); ctx.font=font('700',s,FONT_T);
            ctx.fillStyle=P.deep; ctx.fillText(l3,0,y + 10); }
  ctx.restore();
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
}

const ART = {};          /* id -> HTMLImageElement */
function svgImg(svg) {
  const im = new Image();
  im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  return im;
}
async function loadArt() {
  const jobs = [];
  for (const k in ART_SVG) {
    const im = svgImg(ART_SVG[k]); ART[k] = im;
    jobs.push(new Promise(res => { im.onload = res; im.onerror = res; }));
  }
  await Promise.all(jobs);
}
function setLogoImg(dataUrl) {
  return new Promise(res => {
    if (!dataUrl) { ART.logo = null; return res(); }
    const im = new Image(); im.onload = () => { ART.logo = im; res(); };
    im.onerror = () => { ART.logo = null; res(); }; im.src = dataUrl;
  });
}
function setPhotoImg(dataUrl) {
  return new Promise(res => {
    if (!dataUrl) { ART.photo = null; return res(); }
    const im = new Image(); im.onload = () => { ART.photo = im; res(); };
    im.onerror = () => { ART.photo = null; res(); }; im.src = dataUrl;
  });
}
/* draw art centred in a box, preserving aspect */
function drawArt(ctx, id, x, y, w, h) {
  const im = (id === 'photo') ? ART.photo : ART[id];
  if (!im || !im.complete || !im.naturalWidth) return;
  const sc = Math.min(w/im.naturalWidth, h/im.naturalHeight);
  const dw = im.naturalWidth*sc, dh = im.naturalHeight*sc;
  ctx.drawImage(im, x + (w-dw)/2, y + (h-dh)/2, dw, dh);
}

/* ==========================================================================
   Shared backgrounds
   ========================================================================== */
function bgRadiant(ctx, W, H, P) {
  const g = ctx.createRadialGradient(W/2, H*0.33, 30, W/2, H*0.33, Math.max(W,H)*0.92);
  g.addColorStop(0, P.hi); g.addColorStop(.28, P.lt);
  g.addColorStop(.58, P.mid); g.addColorStop(.82, P.d1); g.addColorStop(1, P.deep);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  /* radiating rays */
  ctx.save(); ctx.translate(W/2, H*0.33);
  for (let i = 0; i < 40; i++) {
    ctx.rotate(Math.PI*2/40);
    ctx.beginPath(); ctx.moveTo(0,0);
    ctx.arc(0,0, Math.max(W,H)*1.2, -0.043, 0.043);
    ctx.closePath(); ctx.fillStyle = 'rgba(255,224,150,.055)'; ctx.fill();
  }
  ctx.restore();
  const v = ctx.createRadialGradient(W/2,H*0.42,W*0.30, W/2,H*0.42, Math.max(W,H)*0.78);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.42)');
  ctx.fillStyle = v; ctx.fillRect(0,0,W,H);
}
function bgTech(ctx, W, H, P) {
  const g = lg(ctx, 0,0, W*0.6, H, [[0,P.deep],[.34,P.d1],[.64,P.mid],[1,P.deep]]);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = 'rgba(255,255,255,.055)'; ctx.lineWidth = 2;
  const step = W/20;
  for (let x = 0; x <= W; x += step) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y = 0; y <= H; y += step) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  const gl = ctx.createRadialGradient(W*0.86,H*0.34,10, W*0.86,H*0.34, W*0.66);
  gl.addColorStop(0,'rgba(255,255,255,.20)'); gl.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = gl; ctx.fillRect(0,0,W,H);
}
function goldFrame(ctx, W, H) {
  ctx.strokeStyle = 'rgba(255,209,102,.8)'; ctx.lineWidth = 3;
  rr(ctx, 26,26, W-52, H-52, 12); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,209,102,.4)'; ctx.lineWidth = 1.5;
  rr(ctx, 34,34, W-68, H-68, 8); ctx.stroke();
}
function toran(ctx, W, P) {
  ctx.strokeStyle = P.gold; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(30,44);
  ctx.quadraticCurveTo(W/2, 74, W-30, 44); ctx.stroke();
  for (let i = 0; i <= 26; i++) {
    const t = i/26, x = 30 + t*(W-60);
    const y = 44 + 30*Math.sin(Math.PI*t);
    const h = i%2 ? 44 : 56, w = i%2 ? 16 : 20;
    ctx.save(); ctx.translate(x,y); ctx.rotate((t-0.5)*0.38);
    ctx.beginPath(); ctx.moveTo(0,0);
    ctx.quadraticCurveTo(w, h*0.45, 0, h);
    ctx.quadraticCurveTo(-w, h*0.45, 0, 0);
    ctx.fillStyle = i%2 ? '#3F8A31' : '#57A845'; ctx.fill(); ctx.restore();
  }
}
/* ==========================================================================
   Templates
   ========================================================================== */
function featRow(ctx, P, x, y, w, h, icon, text) {
  rr(ctx, x, y, w, h, 16);
  ctx.fillStyle = 'rgba(0,0,0,.36)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.20)'; ctx.lineWidth = 2; ctx.stroke();
  const ib = h - 22;
  rr(ctx, x+12, y+11, ib, ib, 14);
  ctx.fillStyle = lg(ctx, x+12, y+11, x+12+ib, y+11+ib, [[0,P.gold],[1,P.gold2]]); ctx.fill();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = font('700', ib*0.56, FONT_T); ctx.fillStyle = P.deep;
  ctx.fillText(icon || '•', x+12+ib/2, y+11+ib/2 + 2);
  const tx = x + 12 + ib + 16, tw = w - (tx - x) - 18;
  const r = wrapFit(ctx, text, tw, 34, 18, '600', 2, FONT_T);
  ctx.textAlign = 'left'; ctx.fillStyle = P.cream;
  const lh = r.size * 1.16, top = y + h/2 - (r.lines.length-1)*lh/2;
  r.lines.forEach((ln,i) => { ctx.font = font('600', r.size, FONT_T); ctx.fillText(ln, tx, top + i*lh); });
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
}

function pillRow(ctx, P, items, y, h) {
  const n = items.length; if (!n) return;
  const pad = 64, gap = 14, w = (SQ - pad*2 - gap*(n-1)) / n;
  items.forEach((it, i) => {
    const x = pad + i*(w+gap);
    rr(ctx, x, y, w, h, 12);
    ctx.fillStyle = 'rgba(0,0,0,.42)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,209,102,.45)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.font = font('700', 30, FONT_T); ctx.fillStyle = P.gold;
    ctx.fillText(it.ic || '•', x + w/2, y + 12);
    const r = wrapFit(ctx, it.t, w-14, 25, 14, '600', 2, FONT_T);
    ctx.fillStyle = P.cream;
    r.lines.forEach((ln,k) => { ctx.font = font('600', r.size, FONT_T);
      ctx.fillText(ln, x + w/2, y + 54 + k*r.size*1.14); });
  });
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
}

function ribbon(ctx, P, left, big, right, y, h) {
  if (!left && !big && !right) return;
  rr(ctx, 90, y, SQ-180, h, 10);
  ctx.fillStyle = lg(ctx, 0, y, 0, y+h, [[0,'#FFE08A'],[.55,P.gold2],[1,'#C77C05']]);
  ctx.shadowColor='rgba(0,0,0,.42)'; ctx.shadowBlur=22; ctx.shadowOffsetY=9; ctx.fill();
  ctx.shadowColor='transparent';
  const inner = SQ - 220;
  const parts = [];
  if (left)  parts.push({ t:left,  f:FONT_T, c:P.goldD, m:1.0 });
  if (big)   parts.push({ t:big,   f:FONT_N, c:'#8E1C05', m:1.16 });
  if (right) parts.push({ t:right, f:FONT_T, c:P.goldD, m:1.0 });
  let size = 46;
  for (; size > 20; size -= 2) {
    let tot = 0;
    parts.forEach(p => { ctx.font = font('700', size*p.m, p.f); tot += ctx.measureText(p.t).width; });
    if (tot + (parts.length-1)*20 <= inner) break;
  }
  let tot = 0;
  parts.forEach(p => { ctx.font = font('700', size*p.m, p.f); tot += ctx.measureText(p.t).width; });
  tot += (parts.length-1)*20;
  let x = (SQ - tot)/2;
  ctx.textAlign='left'; ctx.textBaseline='middle';
  parts.forEach(p => {
    ctx.font = font('700', size*p.m, p.f); ctx.fillStyle = p.c;
    ctx.fillText(p.t, x, y + h/2 + 1);
    x += ctx.measureText(p.t).width + 20;
  });
  ctx.textBaseline='alphabetic';
}

/* ==========================================================================
   Render
   ========================================================================== */
function renderPoster(cv, tplId, d, sizeId) {
  const t = TPL[tplId]; if (!t) return;
  const sz = SIZES.find(s => s.id === sizeId) || SIZES[0];
  cv.width = sz.w; cv.height = sz.h;
  const ctx = cv.getContext('2d');
  const P = pal(d.color || S.profile.color || '#0F4295');
  ctx.save();
  t.bg(ctx, sz.w, sz.h, P);
  ctx.restore();
  const scale = sz.w / SQ;
  const VH = sz.h / scale;          /* height in template units (1080 wide) */
  ctx.save();
  ctx.scale(scale, scale);
  try { t.body(ctx, P, d, VH); } catch (e) { logErr('render ' + tplId, e); }
  ctx.restore();
}

const ED = { tpl:null, key:null, d:null, size:'post', t:null };

function openEditor(tplId, key, fields) {
  ED.tpl = tplId; ED.key = key || null; ED.size = 'post';
  const base = JSON.parse(JSON.stringify(TPL[tplId].d));
  ED.d = Object.assign(base, fields || {});
  if (!ED.d.color) ED.d.color = S.profile.color;
  PROFILE_KEYS.forEach(k => delete ED.d[k]);
  $('edTitle').textContent = TPL[tplId].name;
  $('edMask').classList.add('on');
  buildShareRow(); buildSizeChips(); buildFields(); draw();
}
const PROFILE_KEYS = ['name','area','phone','brandTag','addr'];
function withProfile(d) {
  return Object.assign({}, d, { name:S.profile.name, area:S.profile.area,
                                phone:S.profile.phone, addr:S.profile.addr,
                                brandTag:S.profile.tag });
}
function closeEditor() { $('edMask').classList.remove('on'); }

function buildShareRow() {
  $('shareRow').innerHTML = SHARE_TARGETS.map(t =>
    '<button class="shbtn" data-sh="' + t.id + '" style="background:' + t.bg + '">' +
    '<span class="si">' + t.ic + '</span>' + t.label + '<small>' + t.sub + '</small></button>').join('');
  $('shareRow').querySelectorAll('[data-sh]').forEach(b => b.onclick = () => {
    const t = SHARE_TARGETS.find(x => x.id === b.dataset.sh);
    ED.size = t.size; buildSizeChips(); draw();
    sharePoster(t.label);
  });
}

function buildSizeChips() {
  $('sizeChips').innerHTML = SIZES.map(s =>
    '<button class="chip' + (s.id===ED.size?' on':'') + '" data-s="'+s.id+'">'+s.label+'</button>').join('');
  $('sizeChips').querySelectorAll('.chip').forEach(c => c.onclick = () => {
    ED.size = c.dataset.s; buildSizeChips(); draw();
  });
}

let drawT = null;
function draw() {
  clearTimeout(drawT);
  drawT = setTimeout(() => {
    renderPoster($('cv'), ED.tpl, withProfile(ED.d), ED.size);
  }, 60);
}

function buildFields() {
  const spec = TPL_FIELDS[ED.tpl] || [];
  let h = '';
  spec.forEach(([k, label, type]) => {
    if (type === 'text')
      h += '<div class="fld"><label>'+label+'</label><input data-k="'+k+'" value="'+esc(ED.d[k]||'')+'"></div>';
    else if (type === 'textarea')
      h += '<div class="fld"><label>'+label+'</label><textarea data-k="'+k+'">'+esc(ED.d[k]||'')+'</textarea></div>';
    else if (type === 'badge')
      h += '<div class="fld"><label>'+label+'</label><div class="fld2">'+
           '<input data-k="b1" placeholder="மேல் · Top" value="'+esc(ED.d.b1||'')+'">'+
           '<input data-k="b2" placeholder="பெரிய · Big" value="'+esc(ED.d.b2||'')+'">'+
           '<input data-k="b3" placeholder="கீழ் · Bottom" value="'+esc(ED.d.b3||'')+'"></div>'+
           '<div class="hint">மூன்றும் காலி என்றால் பேட்ஜ் வராது · leave blank to hide</div></div>';
    else if (type === 'ribbon')
      h += '<div class="fld"><label>'+label+'</label><div class="fld2">'+
           '<input data-k="rl" placeholder="இடது · Left" value="'+esc(ED.d.rl||'')+'">'+
           '<input data-k="rb" placeholder="எண் · Number" value="'+esc(ED.d.rb||'')+'">'+
           '<input data-k="rr2" placeholder="வலது · Right" value="'+esc(ED.d.rr2||'')+'"></div></div>';
    else if (type === 'rows')  h += rowsEditor();
    else if (type === 'items') h += itemsEditor();
    else if (type === 'art')   h += artEditor();
    else if (type === 'color') h += colorEditor();
  });
  $('edFields').innerHTML = h;
  wireFields();
}

const EMOJI = ['💰','🎁','🚚','🔧','🛡️','⭐','✅','🔥','📞','🕐','🏷️','💳','🔄','🎧','🌾','🪔','🍰','🛒','👑','💎'];

function wireFields() {
  const box = $('edFields');
  box.querySelectorAll('[data-k]').forEach(el => {
    el.oninput = () => { ED.d[el.dataset.k] = el.value; draw(); };
  });
  box.querySelectorAll('[data-row]').forEach(el => {
    el.oninput = () => { ED.d.rows[+el.dataset.row].t = el.value; draw(); };
  });
  box.querySelectorAll('[data-rdel]').forEach(el => {
    el.onclick = () => { ED.d.rows.splice(+el.dataset.rdel,1); buildFields(); draw(); };
  });
  box.querySelectorAll('[data-ic]').forEach(el => {
    el.onclick = () => pickEmoji(i => { ED.d.rows[+el.dataset.ic].ic = i; buildFields(); draw(); });
  });
  const ra = $('rowAdd');
  if (ra) ra.onclick = () => { (ED.d.rows = ED.d.rows||[]).push({ic:'✅',t:''}); buildFields(); draw(); };

  box.querySelectorAll('[data-in]').forEach(el => {
    el.oninput = () => { ED.d.items[+el.dataset.in].n = el.value; draw(); };
  });
  box.querySelectorAll('[data-ip]').forEach(el => {
    el.oninput = () => { ED.d.items[+el.dataset.ip].p = el.value; draw(); };
  });
  box.querySelectorAll('[data-idel]').forEach(el => {
    el.onclick = () => { ED.d.items.splice(+el.dataset.idel,1); buildFields(); draw(); };
  });
  const ia = $('itemAdd');
  if (ia) ia.onclick = () => { (ED.d.items = ED.d.items||[]).push({n:'',p:''}); buildFields(); draw(); };

  box.querySelectorAll('[data-art]').forEach(el => {
    el.onclick = async () => {
      const id = el.dataset.art;
      if (id === 'photo') { $('artFile').click(); return; }
      ED.d.art = id; buildFields(); draw();
    };
  });
  const pc = $('pcSw');
  if (pc) {
    pc.querySelectorAll('.sw[data-c]').forEach(el => {
      el.onclick = () => { ED.d.color = el.dataset.c; buildFields(); draw(); };
    });
    const ci = pc.querySelector('.sw.custom input');
    if (ci) ci.oninput = () => {
      ED.d.color = ci.value.toUpperCase();
      const code = $('pcCode'); if (code) code.textContent = ED.d.color;
      pc.querySelectorAll('.sw').forEach(s => s.classList.remove('on'));
      ci.parentElement.classList.add('on');
      draw();
    };
  }
  const pr = $('pcReset');
  if (pr) pr.onclick = () => { ED.d.color = S.profile.color; buildFields(); draw(); };
}

function pickEmoji(cb) {
  openSheet('ஐகான் தேர்வு · Pick icon',
    '<div class="artgrid" id="emoBox">' +
    EMOJI.map(e => '<button class="artbtn" data-e="'+e+'" style="font-size:28px">'+e+'</button>').join('') +
    '</div>');
  $('emoBox').querySelectorAll('[data-e]').forEach(b =>
    b.onclick = () => { cb(b.dataset.e); closeSheet(); });
}

   Export / save
   ========================================================================== */
function canvasBlob(cv) {
  return new Promise(res => cv.toBlob(b => res(b), 'image/png'));
}
async function exportBlob() {
  const cv = $('cvExport');
  renderPoster(cv, ED.tpl, withProfile(ED.d), ED.size);
  return canvasBlob(cv);
}
async function downloadPoster() {
  try {
    const b = await exportBlob();
    const url = URL.createObjectURL(b);
    const a = document.createElement('a');
    a.href = url; a.download = 'kadaiposter-' + ED.tpl + '-' + Date.now() + '.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('டவுன்லோட் ஆனது');
  } catch (e) { logErr('download', e); toast('முடியவில்லை. மீண்டும் முயலுங்கள்'); }
}
async function sharePoster(target) {
  try {
    const b = await exportBlob();
    const file = new File([b], 'kadaiposter.png', { type:'image/png' });
    if (navigator.canShare && navigator.canShare({ files:[file] })) {
      await navigator.share({ files:[file] });
      return;
    }
    await downloadPoster();
    toast(target ? (target + '-க்கான அளவில் சேமிக்கப்பட்டது') : 'சேமிக்கப்பட்டது');
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    logErr('share', e);
    await downloadPoster();
  }
}
async function savePoster() {
  try {
    const thumb = document.createElement('canvas');
    renderPoster(thumb, ED.tpl, withProfile(ED.d), 'post');
    const small = document.createElement('canvas');
    small.width = 300; small.height = 300;
    small.getContext('2d').drawImage(thumb, 0, 0, 300, 300);
    const clean = Object.assign({}, ED.d);
    PROFILE_KEYS.forEach(k => delete clean[k]);
    const rec = { tpl:ED.tpl, fields:clean, thumb:small.toDataURL('image/jpeg', 0.72), ts:Date.now() };
    if (ED.key) { await dbSet('posters/' + ED.key, rec); S.posters[ED.key] = rec; }
    else { const k = await dbPush('posters', rec); ED.key = k; S.posters[k] = rec; }
    toast('சேமிக்கப்பட்டது');
  } catch (e) { logErr('savePoster', e); toast('சேமிக்க முடியவில்லை'); }
}

/* ==========================================================================
   Gallery + saved list
   ========================================================================== */
function renderGallery() {
  const ids = Object.keys(TPL);
  $('tplGrid').innerHTML = ids.map(id =>
    '<button class="tcard" data-t="'+id+'">' +
    '<img class="tprev" id="prev_'+id+'" alt="">' +
    '<div class="tname">'+esc(TPL[id].name)+'<small>'+esc(TPL[id].sub)+'</small></div></button>').join('');
  $('tplGrid').querySelectorAll('.tcard').forEach(b =>
    b.onclick = () => openEditor(b.dataset.t));
  const c = document.createElement('canvas');
  ids.forEach(id => {
    const d = withProfile(Object.assign({}, TPL[id].d, { color:S.profile.color }));
    if (!d.name) d.name = 'உங்கள் கடை';
    renderPoster(c, id, d, 'post');
    const s = document.createElement('canvas'); s.width = 420; s.height = 420;
    s.getContext('2d').drawImage(c, 0, 0, 420, 420);
    const el = $('prev_' + id); if (el) el.src = s.toDataURL('image/jpeg', 0.78);
  });
}

function renderMine() {
  const keys = Object.keys(S.posters).sort((a,b) => (S.posters[b].ts||0) - (S.posters[a].ts||0));
  if (!keys.length) {
    $('mineWrap').innerHTML =
      '<div class="empty"><div class="ei">🖼️</div><h4>இன்னும் போஸ்டர் இல்லை · No posters yet</h4>' +
      '<p>"புதிது" பக்கத்தில் ஒரு டெம்ப்ளேட் தேர்வு செய்யுங்கள்</p>' +
      '<button class="btn pri" onclick="go(\'scNew\')">புதிய போஸ்டர் · New Poster</button></div>';
    return;
  }
  $('mineWrap').innerHTML = '<div class="pgrid">' + keys.map(k => {
    const p = S.posters[k];
    return '<div class="pitem"><img src="'+(p.thumb||'')+'" alt="">' +
      '<div class="pbar"><button data-ed="'+k+'">திருத்து · Edit</button>' +
      '<button data-dl="'+k+'">நீக்கு · Delete</button></div></div>';
  }).join('') + '</div>';
  $('mineWrap').querySelectorAll('[data-ed]').forEach(b => b.onclick = () => {
    const k = b.dataset.ed, p = S.posters[k];
    openEditor(p.tpl, k, p.fields);
  });
  $('mineWrap').querySelectorAll('[data-dl]').forEach(b => b.onclick = async () => {
    const k = b.dataset.dl;
    if (!confirm('இந்த போஸ்டரை நீக்கவா?')) return;
    delete S.posters[k];
    try { await dbSet('posters/' + k, null); } catch (e) {}
    renderMine(); toast('நீக்கப்பட்டது');
  });
}

/* ==========================================================================
   Boot
   ========================================================================== */
async function boot() {
  buildPinKeys(); renderPinDots();

  await Promise.all([loadFonts(), loadArt(), ensureAuth()]);

  /* profile + config */
  try {
    const [pf, cf, ps] = await Promise.all([dbGet('profile'), dbGet('config'), dbGet('posters')]);
    if (pf) Object.assign(S.profile, pf);
    S.config = cf || {};
    S.posters = ps || {};
  } catch (e) { logErr('boot load', e); }

  S.pinHash = S.config.pinHash || await sha256(DEFAULT_PIN);
  if (!S.config.pinHash) { S.config.pinHash = S.pinHash; dbSet('config/pinHash', S.pinHash).catch(()=>{}); }
  S.pinLoaded = true;

  await setLogoImg(S.profile.logo || '');
  fillProfileForm();
  renderGallery();

  /* flash ticker from control panel */
  if (fbOK) {
    db.ref(ROOT + '/flashMessage').on('value', s => {
      const v = s.val();
      if (v && v.text && v.on) { $('flashTxt').textContent = v.text; $('flash').classList.add('on'); }
      else $('flash').classList.remove('on');
    }, () => {});
  }

  $('boot').style.display = 'none';
  if (sessionStorage.getItem('kp_unlocked') === '1') {
    $('app').style.display = 'flex';
    setTimeout(autoCheckPopup, 2500);
  } else {
    $('pinScreen').classList.add('on');
  }
  S.ready = true;
}

/* ---------- wiring ---------- */
document.querySelectorAll('.nav button').forEach(b => b.onclick = () => go(b.dataset.sc));
$('btnSaveProfile').onclick = saveProfile;
$('btnLogo').onclick = () => $('logoFile').click();
$('btnLogoDel').onclick = async () => {
  S.profile.logo = ''; await setLogoImg(''); renderLogoPrev();
  await dbSet('profile/logo', ''); renderGallery(); toast('லோகோ நீக்கப்பட்டது');
};
$('logoFile').onchange = async e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  try {
    const url = await readImageResized(f, 400);
    S.profile.logo = url; await setLogoImg(url); renderLogoPrev();
    await dbSet('profile/logo', url); renderGallery(); toast('லோகோ சேமிக்கப்பட்டது');
  } catch (err) { logErr('logo upload', err); toast('படத்தை ஏற்ற முடியவில்லை'); }
  e.target.value = '';
};
$('artFile').onchange = async e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  try {
    const url = await readImageResized(f, 1100);
    ED.d.photoData = url; ED.d.art = 'photo';
    await setPhotoImg(url); buildFields(); draw();
  } catch (err) { logErr('art upload', err); toast('படத்தை ஏற்ற முடியவில்லை'); }
  e.target.value = '';
};
$('btnSetPin').onclick = async () => {
  const v = $('setPin').value.trim();
  if (!/^\d{4}$/.test(v)) { toast('4 இலக்க PIN வேண்டும்'); return; }
  S.pinHash = await sha256(v);
  await dbSet('config/pinHash', S.pinHash);
  $('setPin').value = ''; toast('PIN மாற்றப்பட்டது');
};
$('edClose').onclick = closeEditor;
$('edSave').onclick = savePoster;
$('btnDl').onclick = downloadPoster;
$('btnShare').onclick = () => sharePoster();
$('gClose').onclick = closeSheet;
$('gMask').onclick = e => { if (e.target === $('gMask')) closeSheet(); };
$('btnHelp').onclick = () => openSheet('உதவி · Help',
  '<div class="muted" style="line-height:1.65">' +
  '<b>1.</b> "கடை · Shop" பக்கத்தில் கடை பெயர், போன், லோகோ ஒரு முறை சேமியுங்கள். ' +
  'இது எல்லா போஸ்டரிலும் தானாக வரும்.<br>' +
  '<span style="opacity:.7">Save your shop name, phone and logo once — every poster picks it up.</span><br><br>' +
  '<b>2.</b> "புதிது · New" பக்கத்தில் டெம்ப்ளேட் தேர்வு செய்யுங்கள்.<br>' +
  '<span style="opacity:.7">Pick a template on the New page.</span><br><br>' +
  '<b>3.</b> வாசகம் மாற்றி WhatsApp / Instagram / Facebook பட்டனை அழுத்துங்கள் — ' +
  'அந்த ஆப்-க்கு சரியான அளவில் வரும்.<br>' +
  '<span style="opacity:.7">Edit the text, then tap WhatsApp, Instagram or Facebook — ' +
  'each one exports at that app\'s correct size.</span><br><br>' +
  '<b>PIN:</b> 1234 (மாற்ற: கடை → அமைப்பு)<br><br>' +
  'சந்தேகம் · Support: kadaiposter@gmail.com</div>');

/* PWA: register the service worker and pick up new builds automatically */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) location.reload();
        });
      });
    }).catch(() => {});
  });
}

window.go = go;
boot().catch(e => { logErr('boot', e); $('boot').style.display = 'none'; $('pinScreen').classList.add('on'); });
</script>
